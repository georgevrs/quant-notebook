[project]
name = "quantnb"
version = "0.1.0"
description = "Companion teaching package for Quant Notebook — an open course taking engineers to professional quant level."
readme = "README.md"
license = "MIT"
authors = [{ name = "Georges Verouchis" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pandas>=3.0",
    "polars>=1.30",
    "pyarrow>=19",
    "duckdb>=1.3",
    "scipy>=1.14",
    "statsmodels>=0.14.4",
    "arch>=7.2",
    "scikit-learn>=1.6",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
portfolio = ["cvxpy>=1.6", "skfolio>=0.10"]
deriv = ["QuantLib>=1.36"]
ml = ["lightgbm>=4.5", "shap>=0.46"]
backtest = ["vectorbt>=0.27", "quantstats>=0.0.64"]
tracking = ["mlflow>=3.0"]
live = ["nautilus_trader>=1.220", "alpaca-py>=0.40", "ib_async>=2.0"]
hft = ["hftbacktest>=2.2", "numba>=0.61"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0",
    "jupytext>=1.16",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantnb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
