        deps: [core]
        status: doing
      - id: "4.2"
        slug: point-in-time-biases
        title: Point-in-Time Data & Data Biases
        short: Point-in-Time
        goal: Look-ahead, survivorship, restatements, vintages and delistings — the data biases that manufacture fake alpha, and how to engineer them out.
        prereqs: ["4.1"]
        owns: [point-in-time data, look-ahead bias, survivorship bias, restatement, data vintage, delisting return, backfill bias]
        deps: [core]
        status: doing
      - id: "4.3"
        slug: corporate-actions-security-master
        title: Corporate Actions, Security Master & Continuous Futures
        short: Security Master
        goal: Adjust prices correctly, keep identifiers straight through ticker changes, and stitch futures into continuous series without inventing returns.
        prereqs: ["4.2", "2.4"]
        owns: [adjustment factor, adjusted price, total-return index, security master, security identifier, continuous futures, back-adjustment, ratio adjustment, roll schedule]
        deps: [core]
        status: doing
      - id: "4.4"
        slug: time-calendars-bars
        title: Time, Calendars, As-of Joins & Bars
        short: Time & Bars
