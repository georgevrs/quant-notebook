        prereqs: ["4.4"]
        owns: [Parquet, Apache Arrow, DuckDB, polars, lazy evaluation, partitioning, columnar storage, kdb+]
        deps: [core]
        status: doing
      - id: "4.6"
        slug: lab-research-data-lake
        title: "Lab: Build Your Research Data Lake"
        short: "Lab: Data Lake"
        goal: Build an idempotent, tested, point-in-time data pipeline with quality checks and lineage — the foundation for every later lab.
        prereqs: ["4.3", "4.5"]
        owns: [data quality check, data lineage, idempotent pipeline, data contract]
        deps: [core]
        status: doing

  - id: 5
    slug: statistics-time-series
    name: Statistics & Time Series of Returns
    level: Intermediate
    tracks: [QR, QT, IND]
    thread: "Returns are noisy, fat-tailed and barely predictable — good statistics tells you exactly how little you know."
    sessions:
      - id: "5.1"
        slug: stylized-facts
        title: Stylized Facts of Returns
        short: Stylized Facts
        goal: The empirical regularities every model must respect — fat tails, volatility clustering, the leverage effect, and near-zero autocorrelation.
        prereqs: ["3.2", "4.6"]
        owns: [stylized facts, volatility clustering, leverage effect, autocorrelation, aggregational Gaussianity]
        deps: [core]
        status: doing
      - id: "5.2"
        slug: regression-inference
        title: Regression & Inference That Doesn't Lie
        short: Honest Inference
        goal: OLS alpha and beta, HAC standard errors, overlapping observations, the standard error of a Sharpe ratio, bootstraps and multiple testing.
        prereqs: ["5.1"]
        owns: [ordinary least squares, t-statistic, p-value, HAC standard errors, Newey-West estimator, overlapping observations, standard error of the Sharpe ratio, multiple testing, family-wise error rate, false discovery rate, SPA test, model confidence set]
        deps: [core]
        status: doing
      - id: "5.3"
        slug: bayesian-thinking
        title: "Bayesian Thinking: Priors, Shrinkage & Updating"
        short: Bayesian Thinking
        goal: Priors, posteriors and shrinkage — the machinery behind Ledoit-Wolf, Black-Litterman and Kalman filters, and the honest answer to "is my Sharpe real?"
        prereqs: ["5.2"]
        owns: [prior, posterior, likelihood, conjugate prior, shrinkage, credible interval, empirical Bayes]
        deps: [core]
        status: doing
      - id: "5.4"
        slug: stationarity-arma
        title: Stationarity & ARMA Models
        short: Stationarity & ARMA
        goal: Unit roots, ADF and KPSS, AR/MA/ARMA, ACF and PACF — and why returns are close to unpredictable while prices are not stationary.
        prereqs: ["5.2"]
        owns: [stationarity, unit root, ADF test, KPSS test, autoregressive model, moving-average model, ARMA model, ACF, PACF]
        deps: [core]
        status: doing
      - id: "5.5"
        slug: volatility-modeling
        title: Modeling Volatility
        short: Volatility
        goal: Realized-volatility estimators from OHLC data, EWMA and GARCH forecasts — volatility is the one thing you can forecast well.
        prereqs: ["5.4"]
        owns: [realized volatility, Parkinson estimator, Garman-Klass estimator, Yang-Zhang estimator, EWMA volatility, GARCH model, GJR-GARCH model, volatility forecast]
        deps: [core]
        status: doing
      - id: "5.6"
        slug: cointegration-mean-reversion
        title: Cointegration & Mean Reversion
        short: Cointegration
        goal: Engle-Granger and Johansen tests, hedge ratios, spreads, the Ornstein-Uhlenbeck process as a continuous AR(1), and half-lives.
        prereqs: ["5.4"]
        owns: [cointegration, Engle-Granger test, Johansen test, hedge ratio, spread, Ornstein-Uhlenbeck process, half-life of mean reversion]
        deps: [core]
        status: doing
      - id: "5.7"
        slug: kalman-regimes
        title: Kalman Filters & Regime Models
        short: Kalman & Regimes
        goal: State-space models, the Kalman filter for time-varying hedge ratios, hidden Markov regimes and structural breaks.
        prereqs: ["5.3", "5.6"]
        owns: [state-space model, Kalman filter, dynamic hedge ratio, hidden Markov model, market regime, structural break]
        deps: [core]
        status: doing

  - id: 6
    slug: backtesting-discipline
    name: Backtesting & Research Discipline
    level: Intermediate
    tracks: [QR, QT, QD, IND]
    thread: "A backtest is a unit test that can lie — the discipline is designing it so that it can't."
    sessions:
      - id: "6.1"
        slug: what-a-backtest-is
        title: What a Backtest Is (and Isn't)
        short: What a Backtest Is
        goal: A backtest is a historical simulation under assumptions, not a research tool — what it can prove, what it cannot, and why the gap to live trading exists.
        prereqs: ["1.3", "5.2"]
        owns: [strategy specification, historical simulation, fill assumption, in-sample]
        deps: [core]
        status: doing
      - id: "6.2"
        slug: vectorized-backtester
        title: Build a Vectorized Backtester
        short: Vectorized Backtest
        goal: Signals to positions to returns in a few lines of pandas/polars — and the shift discipline that keeps the future out.
        prereqs: ["6.1"]
        owns: [vectorized backtest, position, turnover, signal lag, equity curve]
        deps: [core]
        status: doing
      - id: "6.3"
        slug: event-driven-backtester
        title: Build an Event-Driven Backtester
        short: Event-Driven
        goal: An event loop with orders, fills and portfolio state — slower, but realistic, and the same shape as a live trading system.
        prereqs: ["6.2"]
        owns: [event-driven backtest, event loop, order, fill, portfolio state, backtest–live parity]
        deps: [core]
        status: doing
      - id: "6.4"
        slug: bias-hall-of-fame
        title: The Bias Hall of Fame
        short: Bias Hall of Fame
        goal: Live demos of every classic way a backtest lies — look-ahead, survivorship, data snooping, selection, stale and untradable prices.
        prereqs: ["6.2", "4.2"]
        owns: [data snooping, selection bias, untradable price, stale price, publication bias]
        deps: [core]
        status: doing
      - id: "6.5"
        slug: costs-capacity
        title: Transaction Costs & Capacity
        short: Costs & Capacity
        goal: Spread, commission, slippage, market impact, borrow and funding — and how costs cap how much capital a strategy can ever run.
        prereqs: ["6.2", "2.1"]
        owns: [transaction cost, commission, slippage, market impact, borrow cost, capacity, break-even cost]
        deps: [core]
        status: doing
      - id: "6.6"
        slug: validation-schemes
        title: "Validation: Walk-Forward, Purged K-Fold & CPCV"
        short: Validation
        goal: Walk-forward analysis, purging and embargo, and combinatorial purged cross-validation — train/test splits that respect time.
        prereqs: ["6.4"]
        owns: [walk-forward analysis, purging, embargo, purged k-fold cross-validation, combinatorial purged cross-validation, leakage]
        deps: [core, portfolio]
        status: doing
      - id: "6.7"
        slug: overfitting-statistics
        title: "Overfitting Statistics: PSR, DSR, MinTRL & PBO"
        short: Overfitting Stats
        goal: The probabilistic and deflated Sharpe ratios, minimum track record length, and the probability of backtest overfitting — how to price in the number of things you tried.
        prereqs: ["6.6", "5.2"]
        owns: [probabilistic Sharpe ratio, deflated Sharpe ratio, minimum track record length, probability of backtest overfitting, CSCV, false strategy theorem, number of trials]
        deps: [core]
        status: doing
      - id: "6.8"
        slug: lab-research-protocol
        title: "Lab: The Research Protocol"
        short: "Lab: Protocol"
        goal: Pre-register a hypothesis, log every trial, sweep parameters, score them with PBO and DSR, and write the go/no-go memo.
        prereqs: ["6.7"]
        owns: [trial log, parameter sweep, experiment tracking, go/no-go memo]
        deps: [core, backtest, tracking]
        status: doing

