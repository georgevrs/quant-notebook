# Quant Notebook — single source of truth for the course structure.
#
# Everything navigational (tab strips, eyebrows, prev/next footers, home cards, status table,
# roadmap, sitemap, head meta, cross-reference text) is generated from this file by
# tools/sync_nav.py. Slugs are FROZEN: renaming one breaks links, Colab URLs and citations.
#
# Session fields
#   id      "U.S" session number            slug   frozen file slug (lowercase, hyphens)
#   title   full title (<h1>, <title>)      short  tab-strip title
#   goal    one line: what the learner walks away with (home cards, meta description)
#   prereqs session numbers assumed known   owns   glossary terms this session DEFINES
#   deps    lab dependency extras           status planned | doing | published
#
# Glossary rule: a term is defined once, by the session that owns it. Every other session links
# to the owner (see AUTHORING.md). Terms a session relies on = owned terms of its prereqs.

course:
  name: Quant Notebook
  tagline: From engineer to quant — markets, math, models and machines.
  repo: georgevrs/quant-notebook
  site_url: https://georgevrs.github.io/quant-notebook/
  branch: main
  author: Georges Verouchis
  duration: ~300 h (100 sessions × 1.5 h + labs)
  level: Engineer → professional quant

tracks:
  QR: { name: Quant Researcher, blurb: "Finds and validates signals; owns the research process." }
  QT: { name: Quant Trader, blurb: "Turns forecasts into positions; lives with execution, risk and P&L." }
  QD: { name: Quant Developer, blurb: "Builds the data, research and trading infrastructure." }
  IND: { name: Independent Trader, blurb: "Runs their own systematic book with their own capital." }

phases:
  - { id: 1, name: Foundations, units: [1, 2, 3, 4], milestone: "Your own research data lake", colour: ultramarine }
  - { id: 2, name: Research Craft, units: [5, 6, 7, 8], milestone: "A strategy report that survives DSR/PBO", colour: pine }
  - { id: 3, name: "Portfolio, Risk & Derivatives", units: [9, 10, 11], milestone: "A risk-managed multi-strategy portfolio", colour: sticky }
  - { id: 4, name: Machines & Markets, units: [12, 13, 14, 15], milestone: "A paper-trading system running", colour: coral }
  - { id: 5, name: The Professional, units: [16], milestone: "Capstone + interview-ready", colour: neutral }

units:
  - id: 1
    slug: quant-landscape
    name: The Quant Landscape
    level: Foundations
    tracks: [QR, QT, QD, IND]
    thread: "Quant finance is engineering for decisions under uncertainty with money on the line — and the job is mostly not fooling yourself."
    sessions:
      - id: "1.1"
        slug: what-quants-do
        title: What Quants Actually Do
        short: What Quants Do
        goal: Map the roles, the firms and how each one actually makes money — so you know which game you are training for.
        prereqs: []
        owns: [quant researcher, quant trader, quant developer, buy side, sell side, proprietary trading firm, market maker, hedge fund, asset manager, portfolio manager, management fee, performance fee, high-water mark]
        deps: [core]
        status: published
      - id: "1.2"
        slug: where-returns-come-from
        title: Where Returns Come From
        short: Sources of Return
        goal: The five honest sources of edge — risk premia, behavioural anomalies, liquidity provision, information and speed — and why most apparent edges are none of them.
        prereqs: ["1.1"]
        owns: [alpha, beta, edge, risk premium, anomaly, liquidity premium, informational edge, latency edge, zero-sum game, equity premium, index fund]
        deps: [core]
        status: published
      - id: "1.3"
        slug: research-lifecycle
        title: The Quant Research Lifecycle
        short: Research Lifecycle
        goal: The master workflow of the whole course — hypothesis to data to signal to validation to sizing to paper to live to decay — and the gates between the stages.
        prereqs: ["1.2"]
        owns: [hypothesis, signal, backtest, out-of-sample, paper trading, alpha decay, research log, pre-registration, kill criterion]
        deps: [core]
        status: published
      - id: "1.4"
        slug: engineers-edge-and-odds
        title: The Engineer's Edge, Blind Spots & Honest Odds
        short: Edge & Odds
        goal: What transfers from software and ML, what breaks in markets, and the evidence on who actually makes money.
        prereqs: ["1.3"]
        owns: [signal-to-noise ratio, non-stationarity, overfitting, backtest-to-live decay, base rate]
        deps: [core]
        status: published
      - id: "1.5"
        slug: quant-lab-setup
        title: Set Up Your Quant Lab
        short: Lab Setup
        goal: A reproducible workbench — uv, Python 3.12, Jupyter, DuckDB, the quantnb package, a research repo layout and a data cache.
        prereqs: ["1.3"]
        owns: [uv, virtual environment, lockfile, jupytext, research repository, data cache, random seed, reproducibility, run manifest]
        deps: [core]
        status: published

  - id: 2
    slug: markets-instruments
    name: Markets & Instruments
    level: Foundations
    tracks: [QR, QT, QD, IND]
    thread: "Every instrument is a contract with a cash-flow profile — learn the plumbing and the P&L arithmetic before you model anything."
    sessions:
      - id: "2.1"
        slug: market-anatomy
        title: Market Anatomy & the Life of an Order
        short: Market Anatomy
        goal: Follow one order from your code through broker, venue, clearing house and custodian — and see where every fee and risk sits.
        prereqs: ["1.1"]
        owns: [exchange, broker, clearing house, central counterparty, custodian, dark pool, market order, limit order, stop order, bid, ask, bid-ask spread, settlement, mid price, NBBO, payment for order flow, time in force]
        deps: [core]
        status: published
      - id: "2.2"
        slug: equities-indices-etfs
        title: Equities, Indices & ETFs
        short: Equities & ETFs
        goal: Shares, dividends, splits, index construction, ETF creation/redemption, and the mechanics and costs of shorting.
        prereqs: ["2.1"]
        owns: [common stock, dividend, stock split, corporate action, index, market-cap weighting, ETF, creation and redemption, short selling, borrow fee, total return, net asset value, authorised participant, free float, ex-dividend date, short squeeze]
        deps: [core]
        status: published
      - id: "2.3"
        slug: returns-pnl-leverage
        title: Returns, P&L, Compounding & Leverage
        short: Returns & Leverage
        goal: The arithmetic every later session relies on — simple vs log returns, compounding, annualisation, volatility drag, Sharpe, drawdown and leverage.
        prereqs: ["2.2"]
        owns: [simple return, log return, excess return, compounding, annualisation, volatility, volatility drag, Sharpe ratio, drawdown, leverage, P&L]
        deps: [core]
        status: published
      - id: "2.4"
        slug: futures
        title: "Futures: Carry, Basis, Roll & Margin"
        short: Futures
        goal: How futures are priced from cost of carry, why curves slope, what roll yield really is, and how margin creates leverage and liquidation risk.
        prereqs: ["2.3"]
        owns: [futures contract, forward contract, cost of carry, basis, contango, backwardation, roll yield, initial margin, variation margin, mark-to-market, expiry, contract multiplier, notional value, maintenance margin, margin call, settlement price, front month, cash-and-carry arbitrage]
        deps: [core]
        status: published
      - id: "2.5"
        slug: fx-commodities
        title: FX & Commodities
        short: FX & Commodities
        goal: Currency quoting, forwards and covered interest parity; commodity term structures, storage and convenience yield.
        prereqs: ["2.4"]
        owns: [currency pair, pip, FX spot, FX forward, covered interest parity, FX carry, convenience yield, commodity term structure, storage cost, forward points, cross-currency basis]
        deps: [core]
        status: published
      - id: "2.6"
        slug: crypto-market-structure
        title: Crypto Market Structure
        short: Crypto
        goal: Centralised vs decentralised venues, AMMs, perpetual futures and funding, basis trades, and the custody and counterparty risks that traditional markets hide from you.
        prereqs: ["2.4"]
        owns: [centralised exchange, decentralised exchange, automated market maker, perpetual future, funding rate, stablecoin, custody risk, counterparty risk, liquidation, impermanent loss, insurance fund, auto-deleveraging, proof of reserves]
        deps: [core]
        status: published
      - id: "2.7"
        slug: options-primer
        title: Options Primer
        short: Options Primer
        goal: Calls, puts, payoffs, put-call parity, intrinsic vs time value, and a first look at implied volatility — enough to read any options discussion.
        prereqs: ["2.3"]
        owns: [call option, put option, strike price, option premium, payoff diagram, moneyness, put-call parity, intrinsic value, time value, implied volatility, European option, American option, covered call, protective put, vertical spread]
        deps: [core]
        status: published

  - id: 3
    slug: math-toolkit
    name: The Quant Math Toolkit
    level: Foundations
    tracks: [QR, QT, QD, IND]
    thread: "The math is a toolkit, not a hurdle — every tool here earns its place by answering a trading question."
    sessions:
      - id: "3.1"
        slug: probability-expected-value
        title: Probability & Expected Value
        short: Probability & EV
        goal: Random variables, expectation, variance, conditioning and Bayes — the language of every bet and every interview question.
        prereqs: ["2.3"]
        owns: [random variable, expected value, variance, standard deviation, covariance, correlation, standard error, conditional probability, conditional expectation, Bayes' rule, independence, law of large numbers, central limit theorem, linearity of expectation, law of total expectation]
        deps: [core]
        status: published
      - id: "3.2"
        slug: distributions-fat-tails
        title: Distributions & Fat Tails
        short: Fat Tails
        goal: Normal, lognormal and Student-t; skewness, kurtosis and tail indices — and why the normal distribution will eventually lie to you.
        prereqs: ["3.1"]
        owns: [normal distribution, lognormal distribution, Student-t distribution, skewness, kurtosis, fat tails, tail index, QQ plot, power law, moment, excess kurtosis, Hill estimator, jump-diffusion model, Hill plot]
        deps: [core]
        status: published
      - id: "3.3"
        slug: linear-algebra-portfolios
        title: Linear Algebra for Portfolios
        short: Linear Algebra
        goal: Weights as vectors, risk as a quadratic form, PCA as the hidden structure of a market — linear algebra through the portfolio lens.
        prereqs: ["3.1"]
        owns: [weight vector, covariance matrix, correlation matrix, portfolio variance, eigenvalue, eigenvector, principal component analysis, positive semi-definite, condition number, diversification ratio, effective number of independent bets, eigen-portfolio, market mode, eigenvalue clipping, nearest correlation matrix, pairwise deletion, listwise deletion, quadratic form, positive definite]
        deps: [core]
        status: published
      - id: "3.4"
        slug: convex-optimization
        title: Convex Optimization
        short: Optimization
        goal: Objectives, constraints, convexity, quadratic programs and Lagrange multipliers — and how to state a portfolio problem so cvxpy can solve it.
        prereqs: ["3.3"]
        owns: [objective function, constraint, convex set, convex function, quadratic program, Lagrange multiplier, KKT conditions, cvxpy, decision variable, feasible set, binding constraint, shadow price, marginal variance, Disciplined Convex Programming]
        deps: [core, portfolio]
        status: published
      - id: "3.5"
        slug: simulation-monte-carlo
        title: Simulation & Monte Carlo
        short: Monte Carlo
        goal: Simulate prices, strategies and uncertainty with seeded Monte Carlo — random walks, GBM, bootstraps and variance reduction.
        prereqs: ["3.2"]
        owns: [Monte Carlo simulation, random walk, geometric Brownian motion, bootstrap, variance reduction, antithetic variates, Monte Carlo standard error, block bootstrap, reflection principle, control variate, common random numbers, Brownian bridge, variance-reduction ratio, batch-means standard error, pseudo-random number generator, discrete monitoring]
        deps: [core]
        status: published
      - id: "3.6"
        slug: kelly-bet-sizing
        title: Bet Sizing, Kelly & Ruin
        short: Kelly & Ruin
        goal: Why the size of a bet matters as much as its edge — Kelly growth, the cost of over-betting, fractional Kelly and risk of ruin.
        prereqs: ["3.5"]
        owns: [Kelly criterion, fractional Kelly, growth rate, risk of ruin, log utility, bet sizing]
        deps: [core]
        status: published

  - id: 4
    slug: data-engineering
    name: Financial Data Engineering
    level: Foundations
    tracks: [QR, QD, IND]
    thread: "Your backtest can only be as honest as your data — point-in-time, or it didn't happen."
    sessions:
      - id: "4.1"
        slug: data-landscape
        title: The Data Landscape, Vendors & Licensing
        short: Data Landscape
        goal: Bars, ticks, quotes, books, fundamentals and macro — who sells what, what it costs, and what the licence lets you do with it.
        prereqs: ["2.1"]
