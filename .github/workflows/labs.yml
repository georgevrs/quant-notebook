name: labs

# Re-run companion labs and check they reproduce their committed results.
# Pull requests: only labs that changed (all of them if src/quantnb changed). Weekly: every lab.

on:
  pull_request:
    paths: ["labs/**", "src/**", "pyproject.toml", "uv.lock"]
  push:
    branches: [main]
    paths: ["labs/**", "src/**", "pyproject.toml", "uv.lock"]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  UV_LOCKED: "1"            # any pyproject/uv.lock drift fails the build instead of re-locking
  QUANTNB_OFFLINE: "1"
  OMP_NUM_THREADS: "1"
  MPLBACKEND: Agg

jobs:
  labs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0   # no moving major tag is published: pin the release
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Changed labs (pull requests)
        if: github.event_name == 'pull_request'
        run: uv run python tools/verify_labs.py --changed
      - name: All labs
        if: github.event_name != 'pull_request'
        run: uv run python tools/verify_labs.py
