name: site

# Validate every page and deploy site/ to GitHub Pages.
# Pages source must be set to "GitHub Actions" (Settings → Pages).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  QUANTNB_OFFLINE: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # sitemap lastmod dates come from git history

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Unit tests (quantnb, math renderer)
        run: |
          uv run pytest -q
          npm test

      - name: Everything is up to date and every session passes the standard
        run: uv run python tools/build.py --check

      - name: HTML validation
        run: npx html-validate "site/**/*.html"

      - name: Generate sitemap.xml
        run: uv run python tools/sync_nav.py

      - name: Internal links and anchors (exact case, as served by Pages)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress --include-fragments
            --exclude-path site/404.html
            'site/**/*.html'
          fail: true

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
