  <text x="56" y="48" font-size="11" text-anchor="end" fill="#4A5A68" style="font-variant-numeric:tabular-nums">100%</text>
  <line x1="64" y1="216" x2="690" y2="216" stroke="#C9CFC6" stroke-width="1"/>
  <path d="M208.5,216 V211 Q208.5,207 212.5,207 H228.5 Q232.5,207 232.5,211 V216 Z" fill="#D64B2A"><title>no cointegration: 5%</title></path>
  <text x="220.5" y="200" font-size="11" text-anchor="middle" fill="#1F2C38" style="font-variant-numeric:tabular-nums">5%</text>
  <text x="220.5" y="234" font-size="11" text-anchor="middle" fill="#4A5A68">no cointegration</text>
  <path d="M521.5,216 V77.7 Q521.5,73.7 525.5,73.7 H541.5 Q545.5,73.7 545.5,77.7 V216 Z" fill="#3A56C5"><title>true cointegration: 83%</title></path>
