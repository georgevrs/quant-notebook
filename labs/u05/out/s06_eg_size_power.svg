<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" style="font-family:'IBM Plex Sans',sans-serif" role="img" aria-label="Engle-Granger rejection rate at 5%: no relationship vs a real 20-day spread">
